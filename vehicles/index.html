<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>TS -> Lua + Three.js Physics Editor</title>
	<style>
		/* ...existing code... */
		html,body { height:100%; margin:0; font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial; }
		.app {
			height:100vh;
			display: grid;
			grid-template-columns: var(--col-split) var(--gutter-size) calc(100% - var(--col-split) - var(--gutter-size));
			grid-template-rows: var(--row-split) var(--gutter-size) calc(100% - var(--row-split) - var(--gutter-size));
			gap:6px;
			padding:6px;
			box-sizing:border-box;
			background:#1e1e1e;
			color:#ddd;
		}
		.panel {
			background:#0f1114;
			border:1px solid #222;
			padding:8px;
			overflow:hidden;
			display:flex;
			flex-direction:column;
			box-sizing:border-box;
		}
		.panel header { font-weight:600; margin-bottom:6px; display:flex;justify-content:space-between;align-items:center; }
		/* Fix: correct textarea selector (removed stray '<') */
		textarea { width:100%; height:100%; resize:none; background:#070707; color:#dcdcdc; border:0; padding:8px; box-sizing:border-box; font-family:monospace; font-size:13px; }
		textarea[readonly]{ opacity:0.95; }
		.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
		.small { font-size:13px; padding:6px 8px; background:#141414; color:#ddd; border:1px solid #2a2a2a; border-radius:4px; }
		#canvas { width:100%; height:100%; display:block; }
		/* Position panels into the new 3x3 grid (gutters occupy middle row/col) */
		.leftTop { grid-column: 1; grid-row: 1; }
		.rightTop { grid-column: 3; grid-row: 1; }
		.leftBottom { grid-column: 1; grid-row: 3; }
		.rightBottom { grid-column: 3; grid-row: 3; }

		/* gutter visuals */
		.gutter-vertical {
			grid-column: 2;
			grid-row: 1 / span 3;
			cursor: col-resize;
			background: transparent;
			/* small visible handle */
			display:flex; align-items:center; justify-content:center;
		}
		.gutter-horizontal {
			grid-column: 1 / span 3;
			grid-row: 2;
			cursor: row-resize;
			background: transparent;
			display:flex; align-items:center; justify-content:center;
		}
		.gutter-handle {
			width:100%;
			height:100%;
			min-height: var(--gutter-size);
			min-width: var(--gutter-size);
		}
		/* Make panels layout header + content; ensure content can shrink correctly */
		.panel { display:flex; flex-direction:column; min-height:0; min-width:0; }
		.panel header { flex: 0 0 auto; }
		/* Ensure CodeMirror and textareas fill remaining space */
		.panel > .CodeMirror, .panel textarea {
			flex: 1 1 auto;
			min-height: 0;
			min-width: 0;
			height: 100%;
			width: 100%;
			box-sizing: border-box;
		}
		/* Force CodeMirror wrapper CSS if loaded */
		.CodeMirror { height: 100% !important; }
	</style>
	<!-- Add CodeMirror for editor + output highlighting -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
	<!-- Dark theme for CodeMirror -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/lua/lua.min.js"></script>
	<!-- javascript mode supports TypeScript via the "typescript" option -->
	<!-- ...existing code... -->
</head>
<body>
	<div class="app">
		<!-- Top-left: TypeScript editor -->
		<section class="panel leftTop">
			<header>
				<span>TypeScript Editor</span>
				<span style="font-size:12px;opacity:0.8">Live: compiles to JS, executes in scene, and emits Lua</span>
				<!-- mode selector (JS or TS) + theme toggle -->
				<select id="modeSelect" class="small" title="Editor language/mode">
					<option value="js">JS</option>
					<option value="ts">TS</option>
				</select>
				<button id="themeToggle" class="small btn" title="Toggle dark theme">Dark</button>
			</header>
			<!-- we keep a hidden textarea for progressive enhancement; CodeMirror will replace it -->
			<textarea id="editor" spellcheck="false"></textarea>
		</section>

		<!-- Vertical gutter between columns -->
		<div class="gutter-vertical" id="gutterV">
			<div class="gutter-handle" aria-hidden="true"></div>
		</div>

		<!-- Top-right: Lua/JS output -->
		<section class="panel rightTop">
			<header>
				<span>Output</span>
				<div style="display:flex;gap:8px;align-items:center;">
					<select id="outputView" class="small">
						<option value="js">JavaScript</option>
						<option value="lua">Lua</option>
					</select>
					<button id="try-transpile" class="small btn" title="Try external TS->Lua">Try external TS->Lua</button>
				</div>
			</header>
			<!-- JS output (read-only) -->
			<textarea id="jsOut" readonly style="display:none"></textarea>
			<!-- Lua output (read-only) -->
			<textarea id="luaOut" readonly></textarea>
		</section>

		<!-- Horizontal gutter between rows -->
		<div class="gutter-horizontal" id="gutterH">
			<div class="gutter-handle" aria-hidden="true"></div>
		</div>

		<!-- Bottom-left: Controls, templates, files, lil-gui placeholder -->
		<section class="panel leftBottom">
			<header>
				<span>Files & Templates</span>
				<div style="display:flex;gap:8px;align-items:center;">
					<select id="templateSelect" class="small"></select>
				</div>
			</header>

			<div class="controls" style="margin-bottom:8px;">
				<input id="filename" class="small" placeholder="file name (eg: main.ts)" />
				<button id="saveAs" class="small btn" title="Save current editor content as a new file">Save As</button>
				<button id="newFile" class="small btn" title="Create a new blank file">New Blank</button>
				<button id="exportLua" class="small btn" title="Export Lua code to .lua file">Export Lua</button>
			</div>

			<div class="file-list" id="fileList" aria-live="polite"></div>

			<div class="footer-note">
				Autosave on keyup. Use Save As to create named files (user templates appear in the templates select).
			</div>
			<!-- ...existing code... -->
		</section>

		<!-- Bottom-right: Three.js + Cannon physics -->
		<section class="panel rightBottom" style="position:relative;padding:0;">
			<header style="position:absolute;z-index:5;width:100%;background:transparent;border-bottom:0;padding:6px;">
				<span style="color:#9ad">Three.js Scene (WASD / Arrows to move)</span>
				<div style="float:right; display:flex; gap:8px; align-items:center;">
					<span style="font-size:12px;color:#888;margin-top:4px;">Gravity: <span id="gravityVal">-9.82</span></span>
					<button id="resetSceneBtn" class="small btn" title="Reset scene">Reset Scene</button>
				</div>
			</header>
			<canvas id="canvas"></canvas>
			<!-- GUI will attach here (lil-gui) -->
		</section>
	</div>

	<!-- Libraries -->
	<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
	<!-- removed cannon-es: we provide a deterministic, Roblox-portable physics implementation in JS instead -->
	<script src="https://unpkg.com/typescript@latest/lib/typescriptServices.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18/dist/lil-gui.min.js"></script>

	<!-- Main app script now loads submodules (scene + utils). Remaining app logic still lives inline below. -->
	<script type="module">
		// Load submodules and wire scene/physics into the page-level script below.
		import { debounce } from './js/utils.js';
		import { setupScene } from './js/scene.js';

		// make debounce available to the inline app code that follows
		window.__app_debounce = debounce;

		// setup scene/renderer/physics using the canvas element that's already in the DOM
		const canvas = document.getElementById('canvas');
		// setupScene returns the core runtime and a startAnimation() function
		const sceneModule = setupScene({ canvas });
		// expose returned properties globally so the rest of the inline script can reference them
		window.scene = sceneModule.scene;
		window.renderer = sceneModule.renderer;
		window.camera = sceneModule.camera;
		window.physics = sceneModule.physics;
		window.makeBoxBody = sceneModule.makeBoxBody;
		window.applyImpulseToBody = sceneModule.applyImpulseToBody;
		window.applyImpulseToBox = sceneModule.applyImpulseToBox;
		window.boxMesh = sceneModule.boxMesh;
		window.boxBody = sceneModule.boxBody;
		window.groundMesh = sceneModule.groundMesh;
		window.coreObjects = sceneModule.coreObjects;

		// start the animation/render loop
		sceneModule.startAnimation();
	</script>

	<script>
		// The remainder of the page's original script expects a `debounce` symbol and scene globals.
		// Provide a thin shim binding to the imported debounce:
		const debounce = window.__app_debounce;

		// App state and utilities
		const STORAGE_KEY = 'vehicles_editor_files_v1';
		const AUTO_SAVE_KEY = 'vehicles_editor_autosave_v1';
		const builtInTemplates = {
			"blank.ts": "// blank file\n",
			"starter-moving-box.ts": "// Starter: moves a box with WASD/Arrows\nconst speed = 6;\nconst applyImpulse = (dirX, dirZ) => {\n\tapplyImpulseToBox(dirX * speed, dirZ * speed);\n};\nregisterUpdate((dt, keys) => {\n\tconst k = keys;\n\tlet x = 0, z = 0;\n\tif (k.ArrowUp || k.w) z -= 1;\n\tif (k.ArrowDown || k.s) z += 1;\n\tif (k.ArrowLeft || k.a) x -= 1;\n\tif (k.ArrowRight || k.d) x += 1;\n\tif (x !== 0 || z !== 0) applyImpulse(x, z);\n});\n",
			"template-001-basics.ts": "// Template 001: Basics\n// Simple rotating box + basic input logging\nregisterUpdate((dt) => {\n\tif (typeof boxMesh !== 'undefined') boxMesh.rotation.y += 0.6 * dt;\n});\nwindow.addEventListener('keydown', (e) => console.log('[template-001] keydown', e.key));\nwindow.addEventListener('keyup', (e) => console.log('[template-001] keyup', e.key));\n",
			"template-002-proxy.ts": "// Template 002: Proxy Demo\n// A simple proxy-style example that nudges the box upward slowly and logs once\nconsole.log('[template-002] running');\nregisterUpdate((dt) => {\n\tif (boxBody) boxBody.velocity.y += 0.5 * dt; // gentle lift\n});\n",
			"template-003-hello.ts": "// Template 003: Hello Three.js\n// Adds a checkerboard floor, a cube, lights and a small rotation animation\ntry { scene.background = new THREE.Color(0x87ceeb); } catch(e){}\n// checkerboard floor\n(function(){\n\tconst size = 512, squares = 8;\n\tconst canvas = document.createElement('canvas');\n\tcanvas.width = canvas.height = size;\n\tconst ctx = canvas.getContext('2d');\n\tif (ctx) {\n\t\tconst sq = size / squares;\n\t\tfor (let y=0;y<squares;y++) for (let x=0;x<squares;x++){\n\t\t\tctx.fillStyle = ((x+y)&1) ? '#ddd' : '#444';\n\t\t\tctx.fillRect(x*sq,y*sq,sq,sq);\n\t\t}\n\t\tconst tex = new THREE.CanvasTexture(canvas);\n\t\tconst mat = new THREE.MeshStandardMaterial({ map: tex });\n\t\tconst g = new THREE.PlaneGeometry(40,40);\n\t\tconst m = new THREE.Mesh(g, mat);\n\t\tm.rotation.x = -Math.PI/2; m.position.y = 0; scene.add(m);\n\t}\n})();\n(function(){\n\tconst geo = new THREE.BoxGeometry(1,1,1);\n\tconst mat = new THREE.MeshStandardMaterial({ color: 0x88ff88 });\n\tconst mesh = new THREE.Mesh(geo, mat);\n\tmesh.position.set(0,1,0);\n\tscene.add(mesh);\n\tregisterUpdate((dt)=>{ mesh.rotation.y += dt * 0.6; mesh.position.y = 1 + Math.sin(Date.now()*0.002)*0.05; });\n\tconsole.log('[template-003] added cube+floor');\n})();\n",
			"hello.js": "// Hello JS: rotate box and map WASD/Arrows to rotate the box\nconsole.log('[hello.js] loaded');\nregisterUpdate((dt, keys) => {\n\t// rotate box using keys: left/right rotate yaw, up/down rotate pitch\n\tif (!boxMesh) return;\n\tconst turnSpeed = 2.0; // radians per second\n\tlet yaw = 0, pitch = 0;\n\tif (keys.a || keys.ArrowLeft) yaw += turnSpeed * dt * -1;\n\tif (keys.d || keys.ArrowRight) yaw += turnSpeed * dt * 1;\n\tif (keys.w || keys.ArrowUp) pitch += turnSpeed * dt * -1;\n\tif (keys.s || keys.ArrowDown) pitch += turnSpeed * dt * 1;\n\t// apply small rotation to mesh and nudge physics velocity direction slightly\n\tboxMesh.rotation.y += yaw;\n\tboxMesh.rotation.x = Math.max(Math.min(boxMesh.rotation.x + pitch, 0.5), -0.5);\n\t// optional: apply slight impulse forward in mesh's -Z local\n\tconst forwardX = -Math.sin(boxMesh.rotation.y);\n\tconst forwardZ = -Math.cos(boxMesh.rotation.y);\n\tif (Math.abs(yaw) > 0 || Math.abs(pitch) > 0) {\n\t\tapplyImpulseToBox(forwardX * 1.2 * dt, forwardZ * 1.2 * dt);\n\t}\n});\n"
		};

		// Simple in-memory file store merged with localStorage
		let files = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
		// current file name
		let currentFile = localStorage.getItem(AUTO_SAVE_KEY) || 'blank.ts';

		// DOM refs
		const editor = document.getElementById('editor');
		const luaOut = document.getElementById('luaOut');
		const jsOut = document.getElementById('jsOut');
		const templateSelect = document.getElementById('templateSelect');
		const fileList = document.getElementById('fileList');
		const filenameInput = document.getElementById('filename');
		const saveAsBtn = document.getElementById('saveAs');
		const newFileBtn = document.getElementById('newFile');
		const exportLuaBtn = document.getElementById('exportLua');
		const tryTranspileBtn = document.getElementById('try-transpile');
		const gravityVal = document.getElementById('gravityVal');
		const outputView = document.getElementById('outputView');
		// Mode selection (js | ts) and CodeMirror mode switch
		const modeSelect = document.getElementById('modeSelect');
		let execMode = localStorage.getItem('vehicles_exec_mode_v1') || 'js';
		if (modeSelect) {
			modeSelect.value = execMode;
		}

		// Ensure editorCM is declared before any function attempts to access it
		// (avoids "Cannot access 'editorCM' before initialization" when updateEditorMode runs early)
		var editorCM;

		function updateEditorMode() {
			if (!editorCM) return;
			if (execMode === 'ts') {
				editorCM.setOption('mode', { name: "javascript", typescript: true });
			} else {
				editorCM.setOption('mode', 'javascript');
			}
			// refresh to apply sizing/style
			editorCM.refresh();
		}
		updateEditorMode();

		if (modeSelect) {
			modeSelect.addEventListener('change', (e) => {
				execMode = modeSelect.value || 'js';
				localStorage.setItem('vehicles_exec_mode_v1', execMode);
				updateEditorMode();
				// re-run compile/eval with new mode
				triggerCompile().catch(err => console.warn('mode switch compile error', err));
			});
		}

		// Ensure these rendering variables exist before other code may reference them
		let scene = null;
		let camera = null;
		let renderer = null;

		// Create Three.js scene and camera now (so other code referencing `scene` won't run before it's defined)
		scene = new THREE.Scene();
		scene.background = new THREE.Color(0x0a0a0a);
		camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1000);
		camera.position.set(0,6,10);

		// track core objects so reset can remove user-added objects
		const coreObjects = new Set();

		const ambient = new THREE.HemisphereLight(0xffffff, 0x444444, 0.8);
		scene.add(ambient);
		coreObjects.add(ambient);

		const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
		dirLight.position.set(5,10,7);
		scene.add(dirLight);
		coreObjects.add(dirLight);
		// create renderer bound to the canvas
		const canvas = document.getElementById('canvas');
		renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
		renderer.setPixelRatio(window.devicePixelRatio || 1);
		renderer.setSize(canvas.clientWidth || 300, canvas.clientHeight || 200);

		// Deterministic, Roblox-portable physics implementation (semi-implicit Euler)
		const physics = {
			gravityY: -9.82,
			ground: { normal: {x:0,y:1,z:0}, height: 0, material: { name: 'groundMat', friction: 0.4, restitution: 0.0 } },
			bodies: [] // array of bodies we will simulate
		};

		function makeBoxBody(opts) {
			const b = {
				position: { x: opts.position.x, y: opts.position.y, z: opts.position.z },
				velocity: { x: 0, y: 0, z: 0 },
				halfExtents: { x: opts.halfExtents.x, y: opts.halfExtents.y, z: opts.halfExtents.z },
				mass: opts.mass || 1,
				angularDamping: opts.angularDamping || 0.5,
				userData: opts.userData || {}
			};
			physics.bodies.push(b);
			return b;
		}

		function applyImpulseToBody(body, impulse) {
			body.velocity.x += impulse.x / body.mass;
			body.velocity.y += impulse.y / body.mass;
			body.velocity.z += impulse.z / body.mass;
		}

		function applyImpulseToBox(x, z) {
			if (typeof boxBody !== 'undefined') applyImpulseToBody(boxBody, { x, y: 0, z });
		}

		function physicsStep(dt) {
			const g = physics.gravityY;
			const groundY = physics.ground.height;
			const mu = physics.ground.material.friction;
			for (const b of physics.bodies) {
				// integrate velocity (semi-implicit Euler)
				b.velocity.y += g * dt;
				// damping
				b.velocity.x *= (1 - Math.min(0.5, b.angularDamping * dt));
				b.velocity.z *= (1 - Math.min(0.5, b.angularDamping * dt));
				// integrate position
				b.position.x += b.velocity.x * dt;
				b.position.y += b.velocity.y * dt;
				b.position.z += b.velocity.z * dt;
				// ground contact
				const bottomY = b.position.y - b.halfExtents.y;
				if (bottomY <= groundY) {
					b.position.y = groundY + b.halfExtents.y;
					if (b.velocity.y < 0) {
						b.velocity.y = -b.velocity.y * (physics.ground.material.restitution || 0);
						if (Math.abs(b.velocity.y) < 0.01) b.velocity.y = 0;
					}
					const speedHoriz = Math.sqrt(b.velocity.x*b.velocity.x + b.velocity.z*b.velocity.z);
					if (speedHoriz > 0.0001) {
						const normalForce = b.mass * Math.abs(g);
						const frictionMag = mu * normalForce * dt;
						const dv = frictionMag / b.mass;
						const nx = b.velocity.x / speedHoriz;
						const nz = b.velocity.z / speedHoriz;
						const newSpeed = Math.max(0, speedHoriz - dv);
						b.velocity.x = nx * newSpeed;
						b.velocity.z = nz * newSpeed;
					} else {
						b.velocity.x = 0;
						b.velocity.z = 0;
					}
				}
			}
		}

		// ground visual
		const groundGeo = new THREE.PlaneGeometry(40,40);
		const groundMat = new THREE.MeshStandardMaterial({ color:0x222222 });
		const groundMesh = new THREE.Mesh(groundGeo, groundMat);
		groundMesh.rotation.x = -Math.PI/2;
		scene.add(groundMesh);
		coreObjects.add(groundMesh);

		// box visual + physics body
		const boxGeo = new THREE.BoxGeometry(1,1,1);
		const boxMatMesh = new THREE.MeshStandardMaterial({ color:0x88aaff });
		let boxMesh = new THREE.Mesh(boxGeo, boxMatMesh);
		boxMesh.castShadow = true;
		scene.add(boxMesh);
		coreObjects.add(boxMesh);
		let boxBody = makeBoxBody({ position: { x:0, y:3, z:0 }, halfExtents: { x:0.5, y:0.5, z:0.5 }, mass: 1, angularDamping: 0.5 });

		// helper: dispose THREE object graph (geometry/material/texture) to avoid leaks
		function disposeObject(obj) {
			try {
				if (obj.geometry) { obj.geometry.dispose && obj.geometry.dispose(); }
				if (obj.material) {
					// material can be an array
					const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
					for (const m of mats) {
						if (m.map) { m.map.dispose && m.map.dispose(); }
						if (m.dispose) m.dispose();
					}
				}
				if (obj.children && obj.children.length) {
					for (const c of obj.children.slice()) {
						disposeObject(c);
						obj.remove(c);
					}
				}
			} catch(e) { /* ignore disposal errors */ }
		}

		// --- Added small helper stubs to prevent ReferenceError for missing functions ---
		// Provide a minimal theme helper so load handler won't blow up if real function is missing
		let isDark = true;
		function applyCodeMirrorTheme(dark) {
			isDark = !!dark;
			const themeBtn = document.getElementById('themeToggle');
			if (themeBtn) themeBtn.textContent = isDark ? 'Dark' : 'Light';
			// real CodeMirror theme application happens where editors are created; this is a safe no-op fallback
		}

		// Populate the templates select using built-in templates + any user-saved files
		function buildTemplateOptions() {
			if (!templateSelect) return;
			templateSelect.innerHTML = '';
			const seen = new Set();
			// add built-in templates first
			for (const k of Object.keys(builtInTemplates)) {
				const opt = document.createElement('option');
				opt.value = k;
				opt.textContent = k;
				templateSelect.appendChild(opt);
				seen.add(k);
			}
			// then user files
			for (const k of Object.keys(files)) {
				if (seen.has(k)) continue;
				const opt = document.createElement('option');
				opt.value = k;
				opt.textContent = k;
				templateSelect.appendChild(opt);
			}
			// keep selection in sync
			if (currentFile) templateSelect.value = currentFile;
		}

		// Render the file list (simple DOM output used by existing click handler)
		function refreshFileList() {
			if (!fileList) return;
			fileList.innerHTML = '';
			const rows = [];
			// built-ins (load-only)
			for (const k of Object.keys(builtInTemplates)) {
				rows.push(`<div style="padding:6px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;">
					<span style="cursor:pointer;color:#8cf" data-load="${k}">${k}</span>
					<button data-load="${k}" class="small">Load</button>
				</div>`);
			}
			// user files (load + delete)
			for (const k of Object.keys(files)) {
				rows.push(`<div style="padding:6px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #111;">
					<span style="cursor:pointer" data-load="${k}">${k}</span>
					<div>
						<button data-load="${k}" class="small">Load</button>
						<button data-del="${k}" class="small" style="margin-left:6px;">Del</button>
					</div>
				</div>`);
			}
			fileList.innerHTML = rows.join('');
		}

		// Minimal triggerCompile implementation:
		// - if execMode === 'ts' and TypeScript is present, transpile to JS
		// - populate jsOut and luaOut (luaOut is a stub placeholder)
		// - eval the compiled JS in the page so user scripts can call registerUpdate(), etc.
		async function triggerCompile() {
			const src = (editorCM && typeof editorCM.getValue === 'function') ? editorCM.getValue() : (editor ? editor.value : '');
			let compiledJs = src;

			if (execMode === 'ts' && window.ts && typeof ts.transpileModule === 'function') {
				try {
					const out = ts.transpileModule(src, { compilerOptions: { module: ts.ModuleKind.ESNext, target: ts.ScriptTarget.ES2017 } });
					compiledJs = out && out.outputText ? out.outputText : compiledJs;
				} catch (e) {
					compiledJs = `// TypeScript transpile error: ${e && e.message ? e.message : String(e)}\n`;
				}
			}

			if (jsOut) jsOut.value = compiledJs;
			if (luaOut) luaOut.value = `-- Lua output (stub)\n-- The app can invoke an external transpiler for TS->Lua. For now this is a placeholder.\n${compiledJs}`;

			// Execute compiled JS so user code registers update callbacks, etc.
			try {
				// clear any existing userUpdate
				userUpdate = null;
				// Wrap in a function that provides commonly expected globals
				const wrapper = new Function('scene', 'THREE', 'sceneApi', 'registerUpdate', 'keys', compiledJs + '\n//# sourceURL=editor.js');
				// Use existing globals (fall back to locally scoped var names)
				wrapper(window.scene || scene, window.THREE || THREE, window.sceneApi || sceneApi, window.registerUpdate || registerUpdate, window.keysDown || keysDown);
			} catch (e) {
				// don't throw to callers; log and keep app running
				console.error('[triggerCompile] runtime error', e);
			}
			return Promise.resolve();
		}
		// --- end added helpers ---

		// Load a file by name (user files or built-in templates).
		function loadFile(name) {
			if (!name) return;
			let content = '';
			if (files && Object.prototype.hasOwnProperty.call(files, name)) {
				content = files[name];
			} else if (builtInTemplates && Object.prototype.hasOwnProperty.call(builtInTemplates, name)) {
				content = builtInTemplates[name];
			} else {
				// unknown file: create an empty placeholder
				content = '// new file: ' + name + '\n';
			}

			currentFile = name;
			try { localStorage.setItem(AUTO_SAVE_KEY, currentFile); } catch (e) {}

			// fill editor (CodeMirror if present, otherwise textarea)
			if (editorCM && typeof editorCM.setValue === 'function') {
				editorCM.setValue(content);
			} else if (editor) {
				editor.value = content;
			}

			// keep UI in sync
			if (templateSelect) templateSelect.value = name;
			if (filenameInput) filenameInput.value = name;

			// refresh lists and compile/run
			buildTemplateOptions();
			refreshFileList();
			triggerCompile().catch(err => console.warn('loadFile: triggerCompile error', err));
		}

		// Save the current editor contents into the in-memory files map and persist to localStorage.
		function saveCurrentTo(name) {
			if (!name) return;
			const content = (editorCM && typeof editorCM.getValue === 'function') ? editorCM.getValue() : (editor ? editor.value : '');
			files = files || {};
			files[name] = content;
			try {
				localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
			} catch (e) { console.warn('saveCurrentTo: could not persist', e); }
			// ensure UI shows the new file
			buildTemplateOptions();
			refreshFileList();
		}

		// Delete a user file and update UI/storage. Built-in templates are not deleted.
		function deleteUserFile(name) {
			if (!name || !files || !Object.prototype.hasOwnProperty.call(files, name)) return;
			delete files[name];
			try { localStorage.setItem(STORAGE_KEY, JSON.stringify(files)); } catch (e) {}
			if (currentFile === name) {
				// pick a sensible fallback
				const fallback = 'blank.ts';
				currentFile = fallback;
				try { localStorage.setItem(AUTO_SAVE_KEY, currentFile); } catch(e){}
				loadFile(fallback);
			} else {
				buildTemplateOptions();
				refreshFileList();
			}
		}

		// Save As
		saveAsBtn.addEventListener('click', ()=> {
			const name = filenameInput.value.trim() || prompt('Filename:','script.ts');
			if (!name) return;
			saveCurrentTo(name);
			currentFile = name;
			localStorage.setItem(AUTO_SAVE_KEY, currentFile);
			buildTemplateOptions();
			refreshFileList();
			alert('Saved as ' + name);
		});

		newFileBtn.addEventListener('click', ()=> {
			currentFile = 'blank.ts';
			loadFile('blank.ts');
		});

		exportLuaBtn.addEventListener('click', ()=> {
			const blob = new Blob([luaOut.value], {type:'text/plain'});
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url; a.download = (currentFile || 'script') + '.lua';
			document.body.appendChild(a); a.click(); a.remove();
			URL.revokeObjectURL(url);
		});

		// Template select change loads file/template
		templateSelect.addEventListener('change', (e)=> {
			const v = templateSelect.value;
			loadFile(v);
		});

		// File-list actions
		fileList.addEventListener('click', (e)=>{
			const t = e.target;
			if (t.dataset.load) loadFile(t.dataset.load);
			if (t.dataset.del) {
				if (confirm('Delete ' + t.dataset.del + ' ?')) {
					deleteUserFile(t.dataset.del);
				}
			}
		});

		// Small API to expose to user scripts (designed to be ported to Roblox Lua easily)
		let userUpdate = null;
		const keysDown = {};
		window.addEventListener('keydown', (e)=>{ keysDown[e.key] = true; });
		window.addEventListener('keyup', (e)=>{ keysDown[e.key] = false; });

		function registerUpdate(fn) { userUpdate = fn; }

		const sceneApi = {
			// use window fallbacks so this object is resilient if executed in different orders
			scene: (typeof window !== 'undefined' && window.scene) ? window.scene : scene,
			THREE: (typeof window !== 'undefined' && window.THREE) ? window.THREE : THREE,
			physics, // expose physics world and material schema (ground, friction, restitution)
			makeBoxBody, applyImpulseToBody, applyImpulseToBox,
			boxMesh, boxBody, groundMesh,
			registerUpdate, keys: keysDown
		};

		// Expose sceneApi globally so user scripts that reference `sceneApi` directly won't throw.
		try { window.sceneApi = sceneApi; } catch (e) { /* ignore on restricted environments */ }

		// Reset scene helper: resets the main box body and proxy target if present
		function resetScene() {
			// Remove user-added objects (anything not in coreObjects)
			try {
				for (const child of scene.children.slice()) {
					if (!coreObjects.has(child)) {
						disposeObject(child);
						scene.remove(child);
					}
				}
			} catch (e) { console.warn('resetScene: error removing user objects', e); }

			// reset main box physics and visual
			if (typeof boxBody !== 'undefined') {
				boxBody.position.x = 0;
				boxBody.position.y = 3;
				boxBody.position.z = 0;
				boxBody.velocity.x = 0;
				boxBody.velocity.y = 0;
				boxBody.velocity.z = 0;
			}
			if (typeof boxMesh !== 'undefined') {
				boxMesh.position.set(0, 3, 0);
				boxMesh.quaternion.set(0, 0, 0, 1);
				boxMesh.rotation.set(0, 0, 0);
			}

			// reset proxy target if present
			if (window.sceneProxy && window.sceneProxy.position) {
				try { window.sceneProxy.position.set(0, 1.5, -3); } catch (e) {}
			}

			// reset camera to default overview
			if (camera) {
				camera.position.set(0, 6, 10);
				camera.lookAt(0, 1, 0);
			}

			console.log('[app] scene reset: cleared user objects, reset core state — reloading user script');

			// Re-run the current editor script so it re-attaches behavior to the fresh scene
			// triggerCompile is async; fire-and-forget but log errors
			try {
				triggerCompile().catch(err => console.warn('resetScene: triggerCompile error', err));
			} catch (e) {
				console.warn('resetScene: could not re-run script', e);
			}
		}
		const resetBtn = document.getElementById('resetSceneBtn');
		if (resetBtn) resetBtn.addEventListener('click', () => resetScene());

		// On initial load: build UI, load last file or blank
		// Try to fetch runtime templates (001 and 002). prefer 002 if available.
		(async function init() {
			const templatesToLoad = ['template-001-basics.ts','template-002-proxy.ts'];
			for (const t of templatesToLoad) {
				try {
					const res = await fetch('./' + t);
					if (res.ok) {
						const txt = await res.text();
						builtInTemplates[t] = txt;
						// prefer the proxy demo as default if present
						if (t === 'template-002-proxy.ts') currentFile = t;
						else if (!currentFile) currentFile = t;
					}
				} catch (e) {
					console.warn('Could not load runtime template', t, e);
				}
			}

			buildTemplateOptions();
			refreshFileList();
			if (!files[currentFile] && !builtInTemplates[currentFile]) currentFile = 'starter-moving-box.ts';
			loadFile(currentFile);
		})();

		// Quick keys: Ctrl+S to Save As prompt
		window.addEventListener('keydown', (e)=>{
			if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 's') {
				e.preventDefault();
				saveAsBtn.click();
			}
		});

		// initial compile (async)
		triggerCompile().catch(err => console.warn('initial compile error', err));
		// CodeMirror setup already creates editorCM/jsCM/luaCM.
		// Ensure the CodeMirror wrappers fill their panels and refresh on resize:
		function refreshAllCodeMirrors() {
			try {
				if (editorCM) editorCM.refresh();
				if (jsCM) jsCM.refresh();
				if (luaCM) luaCM.refresh();
			} catch (e) { /* ignore */ }
		}

		// ResizeObserver to detect panel size changes and refresh CodeMirror
		(function attachResizeObservers() {
			if (typeof ResizeObserver === 'undefined') return;
			const ro = new ResizeObserver(entries => {
				// refresh editors on any resize event (debounced)
				window.requestAnimationFrame(refreshAllCodeMirrors);
			});
			// observe panel elements that contain editors/outputs
			const panels = document.querySelectorAll('.panel');
			panels.forEach(p => ro.observe(p));
		})();

		// Gutter drag behavior (vertical and horizontal) to update CSS vars
		(function setupGutters() {
			const gutterV = document.getElementById('gutterV');
			const gutterH = document.getElementById('gutterH');
			let dragging = null;

			function onPointerDown(e, type) {
				dragging = { type, startX: e.clientX, startY: e.clientY, startCol: parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--col-split')), startRow: parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--row-split')) };
				document.documentElement.setPointerCapture && document.documentElement.setPointerCapture(e.pointerId);
				window.addEventListener('pointermove', onPointerMove);
				window.addEventListener('pointerup', onPointerUp);
				e.preventDefault();
			}

			function onPointerMove(e) {
				if (!dragging) return;
				const rect = document.documentElement.getBoundingClientRect();
				if (dragging.type === 'v') {
					// compute new percentage for left column
					const px = e.clientX - rect.left;
					let pct = Math.max(5, Math.min(95, (px / rect.width) * 100));
					document.documentElement.style.setProperty('--col-split', pct + '%');
				} else if (dragging.type === 'h') {
					const py = e.clientY - rect.top;
					let pct = Math.max(5, Math.min(95, (py / rect.height) * 100));
					document.documentElement.style.setProperty('--row-split', pct + '%');
				}
				// refresh editors while dragging
				refreshAllCodeMirrors();
				e.preventDefault();
			}

			function onPointerUp(e) {
				dragging = null;
				window.removeEventListener('pointermove', onPointerMove);
				window.removeEventListener('pointerup', onPointerUp);
			}

			if (gutterV) gutterV.addEventListener('pointerdown', (e)=>onPointerDown(e, 'v'));
			if (gutterH) gutterH.addEventListener('pointerdown', (e)=>onPointerDown(e, 'h'));
		})();

		// Ensure editors stretch fully on initial load
		window.addEventListener('load', () => {
			// apply theme initially
			applyCodeMirrorTheme(isDark);
			// force CodeMirror wrappers to 100% height if present
			refreshAllCodeMirrors();
		});

		// Attach lil-gui (or a safe mock) to the right-bottom panel so it renders correctly
		(function createGuiAttached() {
			const container = document.querySelector('.rightBottom') || document.body;
			let GUIConstructor = null;
			if (typeof lil !== 'undefined' && lil && typeof lil.GUI === 'function') GUIConstructor = lil.GUI;

			// Minimal mock GUI to avoid errors when lil-gui isn't available
			function MockFolder(){ }
			MockFolder.prototype.add = function(){ return { onChange: ()=>{} }; };
			MockFolder.prototype.listen = function(){ return this; };
			MockFolder.prototype.close = function(){};
			MockFolder.prototype.addFolder = function(){ return new MockFolder(); };

			function MockGUI(){ this.domElement = document.createElement('div'); }
			MockGUI.prototype.addFolder = function(){ return new MockFolder(); };
			MockGUI.prototype.close = function(){};

			if (!GUIConstructor) GUIConstructor = MockGUI;

			const gui = new GUIConstructor({ width: 300 });
			// Attach to container and position
			if (gui.domElement && container) {
				gui.domElement.style.position = 'absolute';
				gui.domElement.style.top = '8px';
				gui.domElement.style.right = '8px';
				gui.domElement.style.zIndex = 20;
				container.appendChild(gui.domElement);
			}

			try { gui.close && gui.close(); } catch(e){}

			// Physics controls (safe no-op if mock)
			const physFolder = (typeof gui.addFolder === 'function') ? gui.addFolder('Physics') : new MockFolder();
			const physParams = { gravityY: physics.gravityY, groundFriction: physics.ground.material.friction };
			try {
				// Add gravity control
				physFolder.add(physParams, 'gravityY', -20, 0, 0.1).onChange && physFolder.add(physParams, 'gravityY', -20, 0, 0.1).onChange(v => {
					physics.gravityY = v;
					gravityVal.textContent = v.toFixed(2);
				});
				// Add friction control
				physFolder.add(physParams, 'groundFriction', 0, 5, 0.01).onChange && physFolder.add(physParams, 'groundFriction', 0, 5, 0.01).onChange(v => {
					physics.ground.material.friction = v;
				});
			} catch (e) { /* ignore */ }

			// Ground material folder
			const groundSchema = physics.ground.material;
			const gmFolder = (typeof gui.addFolder === 'function') ? gui.addFolder('GroundMaterial') : new MockFolder();
			try {
				gmFolder.add(groundSchema, 'name').listen && gmFolder.add(groundSchema, 'name').listen();
				gmFolder.add(groundSchema, 'friction', 0, 5, 0.01).onChange && gmFolder.add(groundSchema, 'friction', 0, 5, 0.01).onChange(v => { groundSchema.friction = v; });
				gmFolder.add(groundSchema, 'restitution', 0, 1, 0.01).onChange && gmFolder.add(groundSchema, 'restitution', 0, 1, 0.01).onChange(v => { groundSchema.restitution = v; });
			} catch (e) {}
		})();
	</script>
